# Same checks as the local pre-commit hook (npm run check), run on every push as a backstop.
# Vercel deploys independently; a red run here means the live site may be broken: fix forward quickly.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci && npm --prefix server ci && npm --prefix client ci
      - run: npm run check
